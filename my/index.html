ing platforms", "온라인 학습 플랫폼이 확대되면서"], ["such as MOOCs,", "MOOC와 같은,"], ["understanding adult learners' engagement in online environments", "온라인 환경에서 성인학습자의 학습참여를 이해하는 것은"], ["has become increasingly important.", "점점 더 중요해졌다."]], [["This study examined the effects of self-efficacy and social presence", "본 연구는 자기효능감과 사회적 실재감의 영향을 검증하였다"], ["on learning flow and learning satisfaction", "학습몰입과 학습만족에 대한"], ["among adult learners in online courses.", "온라인 강좌의 성인학습자들 사이에서."]], [["Data from 356 adult learners were analyzed", "성인학습자 356명의 자료가 분석되었다"], ["using structural equation modeling.", "구조방정식모형을 활용하여."]], [["Self-efficacy had a direct effect on learning satisfaction,", "자기효능감은 학습만족에 직접적인 영향을 미쳤다,"], ["and social presence influenced learning satisfaction indirectly", "그리고 사회적 실재감은 학습만족에 간접적으로 영향을 미쳤다"], ["through learning flow.", "학습몰입을 통해."]], [["These results highlight the importance", "이러한 결과는 중요성을 보여준다"], ["of designing interactive online courses", "상호작용적인 온라인 강좌를 설계하는 것의"], ["that foster a sense of connection among learners.", "학습자 간의 연결감을 길러 주는."]]], "p15": [[["This study aims to understand the lifelong learning experiences", "본 연구는 평생학습 경험을 이해하는 것을 목적으로 한다"], ["of marriage migrant women in Korea.", "한국에 있는 결혼이주여성의."]], [["Using narrative inquiry,", "내러티브 탐구를 활용하여,"], ["the study analyzed the life stories of five women", "본 연구는 여성 5명의 생애 이야기를 분석하였다"], ["who had participated in Korean language and community programs", "한국어 및 지역사회 프로그램에 참여해 온"], ["for more than three years.", "3년 이상."]], [["Their learning was initially driven by the need", "그들의 학습은 처음에 필요에 의해 추동되었다"], ["to adapt to daily life,", "일상생활에 적응해야 할,"], ["such as communicating with family members and raising children.", "가족과 의사소통하고 자녀를 양육하는 것과 같은."]], [["Over time, however,", "그러나 시간이 지나면서,"], ["they began to see themselves", "그들은 자신을 바라보기 시작하였다"], ["not as recipients of support", "지원의 수혜자로서가 아니라"], ["but as active members of the community", "지역사회의 능동적인 구성원으로서"], ["who could teach others.", "다른 사람을 가르칠 수 있는."]], [["The study suggests that", "본 연구는 ~을 시사한다"], ["multicultural education programs should move beyond assimilation", "다문화교육 프로그램이 동화주의를 넘어서야 한다"], ["and recognize migrants' cultural resources.", "그리고 이주민의 문화적 자원을 인정해야 한다."]]], "p16": [[["The purpose of this study was to develop a competency model", "본 연구의 목적은 역량모델을 개발하는 것이었다"], ["for lifelong educators", "평생교육사를 위한"], ["working in local governments.", "지방자치단체에서 일하는."]], [["A literature review and in-depth interviews were first conducted", "문헌연구와 심층면담이 먼저 실시되었다"], ["to draft the initial competency items.", "초기 역량 항목을 작성하기 위해."]], [["Then,", "그다음,"], ["a three-round Delphi survey was administered", "3차에 걸친 델파이 조사가 실시되었다"], ["to a panel of twenty experts in lifelong education.", "평생교육 전문가 20명으로 구성된 패널에게."]], [["As a result,", "그 결과,"], ["the final model consisted of four competency clusters and eighteen competencies,", "최종 모델은 4개의 역량군과 18개의 역량으로 구성되었다,"], ["including program planning, networking, and needs assessment.", "프로그램 기획, 네트워킹, 요구분석을 포함하여."]], [["The content validity of each competency", "각 역량의 내용타당도는"], ["was confirmed by the experts' consensus.", "전문가들의 합의로 확인되었다."]], [["The model can be used as a basis", "이 모델은 기초로 활용될 수 있다"], ["for the training and evaluation of lifelong educators.", "평생교육사의 연수와 평가를 위한."]]], "p17": [[["Drawing on Freire's critical pedagogy,", "프레이리의 비판교육학을 바탕으로,"], ["this study examines", "본 연구는 검토한다"], ["how adult literacy education can function", "성인문해교육이 어떻게 기능할 수 있는지를"], ["as a practice of conscientization", "의식화의 실천으로서"], ["rather than mere skill acquisition.", "단순한 기술 습득이 아니라."]], [["Participant observation and interviews were conducted", "참여관찰과 면담이 실시되었다"], ["over eighteen months", "18개월에 걸쳐"], ["in a community literacy school,", "한 지역 문해학교에서,"], ["involving learners, teachers, and activists.", "학습자, 교사, 활동가를 포함하여."]], [["The analysis showed that learners,", "분석 결과 학습자들은,"], ["many of whom had internalized a sense of shame", "그들 중 다수는 수치심을 내면화하고 있었는데"], ["about their lack of schooling,", "학교교육을 받지 못한 것에 대한,"], ["gradually came to interpret their experiences", "점차 자신의 경험을 해석하게 되었다"], ["in relation to broader social structures.", "더 넓은 사회구조와 관련지어."]], [["Dialogue-based classes,", "대화 중심 수업은,"], ["in which learners' own words and life stories became the teaching materials,", "학습자 자신의 말과 생애 이야기가 교재가 되는,"], ["played a decisive role", "결정적인 역할을 하였다"], ["in this transformation.", "이러한 변화에서."]], [["Nevertheless,", "그럼에도 불구하고,"], ["the pressure to produce measurable outcomes for funding agencies", "지원기관을 위해 측정 가능한 성과를 내야 한다는 압박은"], ["often conflicted with the pedagogical principles of the school.", "종종 학교의 교육적 원칙과 충돌하였다."]], [["The study argues that", "본 연구는 ~라고 주장한다"], ["literacy policy should acknowledge", "문해정책은 인정해야 한다"], ["the political and emancipatory dimensions of adult learning.", "성인학습의 정치적·해방적 차원을."]]], "p18": [[["Intergenerational learning programs,", "세대 간 학습 프로그램은,"], ["in which older adults and young people learn together,", "노인과 젊은이가 함께 배우는,"], ["have been promoted as a strategy", "전략으로서 장려되어 왔다"], ["to address age segregation in aging societies.", "고령사회의 연령 분리 문제에 대응하기 위한."]], [["Yet,", "그러나,"], ["little is known about", "~에 대해서는 거의 알려져 있지 않다"], ["how participants themselves experience and make sense of such encounters.", "참여자들 스스로가 그러한 만남을 어떻게 경험하고 이해하는지."]], [["Adopting a hermeneutic phenomenological approach,", "해석학적 현상학의 접근을 채택하여,"], ["this study analyzed interviews", "본 연구는 면담을 분석하였다"], ["with eight older adults and eight university students", "노인 8명과 대학생 8명과의"], ["who had participated in a semester-long intergenerational program.", "한 학기 동안 세대 간 프로그램에 참여했던."]], [["Four themes emerged:", "네 가지 주제가 도출되었다:"], ["dismantling stereotypes,", "고정관념 해체,"], ["negotiating differences in communication,", "의사소통의 차이 조율,"], ["reciprocal teaching,", "상호 가르침,"], ["and rediscovering one's own life stage.", "그리고 자신의 생애단계 재발견."]], [["Notably,", "주목할 점은,"], ["both groups reported that", "두 집단 모두 ~라고 보고하였다"], ["encountering the other generation", "다른 세대를 만나는 것이"], ["prompted them to reflect on their own aging and future.", "자신의 노화와 미래를 성찰하도록 이끌었다."]], [["These findings suggest that", "이러한 결과는 ~을 시사한다"], ["intergenerational learning can be understood", "세대 간 학습은 이해될 수 있다"], ["not merely as an exchange of knowledge", "단순한 지식의 교환으로서가 아니라"], ["but as a mutual process of identity reconstruction.", "정체성을 재구성하는 상호적 과정으로서."]]], "p19": [[["Although numerous studies have reported positive associations", "많은 연구가 정적 관련성을 보고해 왔지만"], ["between self-directed learning and various learning outcomes,", "자기주도학습과 다양한 학습성과 간의,"], ["their findings have been inconsistent in magnitude.", "그 결과는 크기 면에서 일관되지 않았다."]], [["This meta-analysis synthesized 64 empirical studies", "본 메타분석은 실증연구 64편을 종합하였다"], ["published in Korean academic journals", "국내 학술지에 게재된"], ["between 2005 and 2024.", "2005년에서 2024년 사이에."]], [["Using a random-effects model,", "무선효과모형을 사용하여,"], ["the overall correlation between self-directed learning and learning outcomes", "자기주도학습과 학습성과 간의 전체 상관은"], ["was found to be moderate (r = .41).", "중간 수준(r = .41)으로 나타났다."]], [["Moderator analyses revealed that", "조절변인 분석 결과 ~으로 드러났다"], ["effect sizes were larger for affective outcomes,", "효과크기는 정의적 성과에서 더 컸다,"], ["such as satisfaction and motivation,", "만족과 동기와 같은,"], ["than for cognitive outcomes,", "인지적 성과보다,"], ["such as achievement.", "성취도와 같은."]], [["In addition,", "또한,"], ["studies of adult learners yielded larger effect sizes", "성인학습자 대상 연구는 더 큰 효과크기를 보였다"], ["than those of adolescents.", "청소년 대상 연구보다."]], [["Implications for future research,", "후속연구를 위한 시사점이,"], ["including the need for longitudinal designs and objective outcome measures,", "종단적 설계와 객관적 성과 측정의 필요성을 포함하여,"], ["are discussed.", "논의된다."]]], "p20": [[["As artificial intelligence transforms the nature of work,", "인공지능이 일의 성격을 변화시키면서,"], ["organizations are increasingly expected", "조직은 점점 더 요구받고 있다"], ["to provide reskilling opportunities for their employees.", "구성원에게 재교육 기회를 제공하도록."]], [["This study examined", "본 연구는 검증하였다"], ["how individual and organizational factors jointly influence", "개인 요인과 조직 요인이 어떻게 함께 영향을 미치는지를"], ["employees' participation in workplace learning.", "구성원의 일터학습 참여에."]], [["Multilevel analysis was performed", "다층분석이 실시되었다"], ["on data from 2,140 employees", "근로자 2,140명의 자료에 대해"], ["nested within 186 companies,", "186개 기업에 속한,"], ["drawn from the Human Capital Corporate Panel.", "인적자본기업패널에서 추출된."]], [["At the individual level,", "개인 수준에서,"], ["learning motivation and perceived career prospects", "학습동기와 지각된 경력 전망은"], ["were positively associated with participation,", "참여와 정적으로 관련되었다,"], ["whereas age showed a negative association.", "반면 연령은 부적 관련을 보였다."]], [["At the organizational level,", "조직 수준에서,"], ["a supportive learning culture", "지원적인 학습문화는"], ["not only increased participation directly", "참여를 직접 높였을 뿐 아니라"], ["but also weakened the negative effect of age.", "연령의 부정적 영향도 약화시켰다."]], [["These results indicate that", "이러한 결과는 ~을 나타낸다"], ["reskilling policies should target organizational learning environments", "재교육 정책이 조직의 학습환경을 겨냥해야 한다"], ["as well as individual motivation,", "개인의 동기뿐 아니라,"], ["particularly for older workers.", "특히 고령 근로자를 위해."]]], "m1": [[["Becoming a parent is a major life transition", "부모가 되는 것은 중요한 생애전환이다"], ["that reshapes one's identity, marital relationship, and values about family.", "개인의 정체성, 부부관계, 가족에 대한 가치관을 재구성하는."]], [["However,", "그러나,"], ["existing parent education has focused largely", "기존의 부모교육은 주로 초점을 맞추어 왔다"], ["on pregnancy, childbirth, and child-rearing skills,", "임신, 출산, 양육기술에,"], ["paying little attention to the learning of adults", "성인의 학습에는 거의 주목하지 않으면서"], ["before parenthood.", "부모가 되기 이전의."]], [["This study explored the learning needs", "본 연구는 학습요구를 탐색하였다"], ["of prospective parents and newlywed couples", "예비부모와 신혼부부의"], ["and examined how parental identity is formed", "그리고 부모정체성이 어떻게 형성되는지 살펴보았다"], ["from the perspective of adult learning.", "성인학습의 관점에서."]], [["In-depth interviews with fourteen participants revealed that", "연구참여자 14명과의 심층면담 결과 ~으로 드러났다"], ["reflecting on their family-of-origin experiences and conflict styles", "자신의 원가족 경험과 갈등방식을 성찰하는 것이"], ["was a central part of preparing for parenthood.", "부모됨 준비의 핵심적인 부분이었다."]], [["Couples also negotiated their views", "부부는 또한 관점을 조율하였다"], ["on family values and parental roles", "가족가치와 부모역할에 대한"], ["through ongoing dialogue.", "지속적인 대화를 통해."]], [["The findings suggest that", "연구 결과는 ~을 시사한다"], ["parent education should be reconceptualized", "부모교육이 재개념화되어야 한다"], ["as a process of adult growth and learning", "성인의 성장과 학습의 과정으로"], ["rather than a set of child-rearing techniques.", "양육기술의 집합이 아니라."]]], "m2": [[["As Korean universities expand undeclared and liberal studies admissions,", "한국 대학들이 무전공·자유전공 입학을 확대함에 따라,"], ["students are increasingly required", "학생들은 점점 더 요구받고 있다"], ["to explore and choose their majors", "자신의 전공을 탐색하고 선택하도록"], ["after enrollment.", "입학 후에."]], [["This study examined", "본 연구는 살펴보았다"], ["how undeclared students explore and decide on their majors,", "무전공 학생들이 어떻게 전공을 탐색하고 결정하는지를,"], ["focusing on self-understanding and career identity.", "자기이해와 진로정체성에 초점을 맞추어."]], [["A qualitative study was conducted", "질적 연구가 수행되었다"], ["through in-depth interviews", "심층면담을 통해"], ["with ten undeclared students", "무전공 학생 10명과의"], ["in their first and second years.", "1, 2학년인."]], [["The findings revealed that", "연구 결과 ~으로 나타났다"], ["choosing a major was not a single decision", "전공선택은 단 한 번의 결정이 아니었다"], ["but a learning process", "그것은 학습과정이었다"], ["in which students questioned their interests,", "학생들이 자신의 흥미를 묻고,"], ["gathered information,", "정보를 모으고,"], ["and reinterpreted their experiences.", "자신의 경험을 재해석하는."]], [["Professors, senior students, and parents,", "교수, 선배, 부모,"], ["as well as institutional information,", "그리고 제도적 정보가,"], ["played distinct roles in this process.", "이 과정에서 각기 다른 역할을 하였다."]], [["The study provides implications", "본 연구는 시사점을 제공한다"], ["for designing major exploration and career development programs", "전공탐색 및 진로개발 프로그램을 설계하는 데"], ["in universities.", "대학에서."]]], "m3": [[["While many universities offer liberal arts courses", "많은 대학이 교양과목을 제공하고 있지만"], ["on college life and career planning,", "대학생활과 진로설계에 관한,"], ["little is known about", "~에 대해서는 알려진 바가 거의 없다"], ["how self-understanding is actually formed", "자기이해가 실제로 어떻게 형성되는지"], ["through such education.", "그러한 교육을 통해."]], [["Viewing self-understanding", "자기이해를 바라보면서"], ["not as the result of a psychological test", "심리검사의 결과로서가 아니라"], ["but as a learning process of interpreting one's experiences,", "자신의 경험을 해석하는 학습과정으로서,"], ["this study explored", "본 연구는 탐색하였다"], ["how first-year students construct their career identity.", "대학 신입생들이 자신의 진로정체성을 어떻게 구성하는지를."]], [["Data were collected from interviews and reflective journals", "자료는 면담과 성찰일지로부터 수집되었다"], ["of twelve students", "학생 12명의"], ["enrolled in a career and life design course.", "진로·생애설계 과목을 수강한."]], [["Students' self-understanding shifted", "학생들의 자기이해는 변화하였다"], ["from describing themselves through external labels,", "외부의 이름표를 통해 자신을 설명하는 것에서,"], ["such as test results and grades,", "검사 결과와 성적 같은,"], ["to articulating their own values and meanings.", "자신의 가치와 의미를 표현하는 것으로."]], [["Opportunities for narrative reflection and dialogue with peers", "서사적 성찰과 동료와의 대화 기회가"], ["were identified as key learning experiences", "핵심 학습경험으로 확인되었다"], ["that facilitated this shift.", "이러한 변화를 촉진한."]], [["These findings highlight the need", "이러한 결과는 필요성을 보여준다"], ["to redesign university general education", "대학 교양교육을 재설계할"], ["from the perspective of lifelong learning and life design.", "평생학습과 생애설계의 관점에서."]]], "b1": [[["Since the 1970s,", "1970년대 이후로,"], ["andragogy has been one of the most influential frameworks", "앤드라고지는 가장 영향력 있는 틀 가운데 하나였다"], ["in the field of adult education.", "성인교육 분야에서."]], [["Knowles (1980) defined andragogy", "놀스(1980)는 앤드라고지를 정의하였다"], ["as \"the art and science of helping adults learn,\"", "\"성인의 학습을 돕는 기술이자 과학\"으로,"], ["and contrasted it with pedagogy,", "그리고 그것을 페다고지와 대비하였다,"], ["which literally refers to the art and science of teaching children.", "페다고지는 문자 그대로 아동을 가르치는 기술과 과학을 뜻한다."]], [["According to Knowles,", "놀스에 따르면,"], ["adults differ from children", "성인은 아동과 다르다"], ["in several important respects.", "몇 가지 중요한 측면에서."]], [["First,", "첫째,"], ["as people mature,", "사람이 성숙해 감에 따라,"], ["their self-concept moves from being dependent", "그들의 자아개념은 의존적인 상태에서 옮겨 간다"], ["toward being self-directed.", "자기주도적인 상태로."]], [["Second,", "둘째,"], ["adults accumulate a growing reservoir of experience,", "성인은 점점 늘어나는 경험의 저장고를 축적한다,"], ["which becomes a rich resource for learning.", "그리고 그것은 학습을 위한 풍부한 자원이 된다."]], [["Third,", "셋째,"], ["their readiness to learn is closely related", "그들의 학습준비도는 밀접하게 관련되어 있다"], ["to the developmental tasks of their social roles.", "사회적 역할에 따른 발달과업과."]], [["Fourth,", "넷째,"], ["adults tend to be problem-centered rather than subject-centered,", "성인은 교과 중심이기보다 문제 중심적인 경향이 있다,"], ["seeking knowledge that can be applied immediately.", "즉시 적용할 수 있는 지식을 추구하면서."]], [["Later,", "이후,"], ["Knowles added that", "놀스는 ~라고 덧붙였다"], ["adults are motivated more by internal factors", "성인은 내적 요인에 의해 더 동기화된다"], ["than by external rewards.", "외적 보상보다."]], [["Although these assumptions have guided program design for decades,", "이러한 가정들은 수십 년간 프로그램 설계를 이끌어 왔지만,"], ["they have also been criticized.", "그것들은 비판을 받기도 하였다."]], [["Critics argue that", "비판자들은 ~라고 주장한다"], ["the distinction between adults and children is overstated", "성인과 아동의 구분이 과장되어 있다"], ["and that andragogy pays insufficient attention", "그리고 앤드라고지가 충분한 관심을 기울이지 않는다"], ["to the social and cultural contexts of learning (Merriam, Caffarella, & Baumgartner, 2007).", "학습의 사회적·문화적 맥락에 (메리엄 외, 2007)."]], [["Nevertheless,", "그럼에도,"], ["andragogy remains valuable as a set of guidelines", "앤드라고지는 지침으로서 여전히 가치가 있다"], ["that reminds educators to respect adult learners' autonomy and experience.", "교육자에게 성인학습자의 자율성과 경험을 존중하도록 일깨우는."]]], "b2": [[["Transformative learning theory,", "전환학습 이론은,"], ["first proposed by Mezirow (1978),", "메지로우(1978)가 처음 제안한,"], ["explains how adults change the way", "성인이 방식을 어떻게 바꾸는지 설명한다"], ["they interpret their experiences and the world.", "자신의 경험과 세계를 해석하는."]], [["At the center of the theory", "이 이론의 중심에는"], ["is the concept of meaning perspectives,", "의미관점이라는 개념이 있다,"], ["which are broad sets of assumptions", "그것은 포괄적인 가정의 체계이다"], ["acquired largely through cultural assimilation in childhood.", "주로 어린 시절의 문화적 동화를 통해 습득된."]], [["These perspectives act as filters", "이러한 관점은 여과 장치로 작용한다"], ["that shape how we perceive, understand, and remember events.", "우리가 사건을 지각하고 이해하고 기억하는 방식을 형성하는."]], [["According to Mezirow (1991),", "메지로우(1991)에 따르면,"], ["transformation often begins with a disorienting dilemma,", "전환은 흔히 혼란스러운 딜레마에서 시작된다,"], ["such as the death of a loved one, divorce, or job loss,", "사랑하는 사람의 죽음, 이혼, 실직과 같은,"], ["that cannot be resolved", "해결될 수 없는"], ["by applying previous ways of thinking.", "기존의 사고방식을 적용해서는."]], [["Such an experience prompts critical reflection", "이러한 경험은 비판적 성찰을 촉발한다"], ["on the assumptions", "가정에 대한"], ["that underlie one's beliefs.", "자신의 신념 밑에 깔린."]], [["Through rational discourse with others,", "타인과의 합리적 담론을 통해,"], ["learners test the validity of new interpretations", "학습자는 새로운 해석의 타당성을 검증한다"], ["and gradually integrate them into their lives.", "그리고 점차 그것을 자신의 삶에 통합한다."]], [["The result is a perspective", "그 결과는 관점이다"], ["that is more inclusive, discriminating, open, and reflective.", "보다 포괄적이고, 분별력 있으며, 개방적이고, 성찰적인."]], [["Transformative learning has been widely applied", "전환학습은 폭넓게 적용되어 왔다"], ["in areas such as health education, workplace learning, and community development.", "보건교육, 일터학습, 지역사회 개발과 같은 영역에서."]], [["However,", "그러나,"], ["the theory has been criticized", "이 이론은 비판을 받아 왔다"], ["for overemphasizing rationality", "합리성을 지나치게 강조한다는 점에서"], ["and for neglecting the roles of emotion, relationships, and social power.", "그리고 정서, 관계, 사회적 권력의 역할을 소홀히 한다는 점에서."]], [["In response,", "이에 대한 응답으로,"], ["later scholars have proposed more holistic approaches", "후대 학자들은 보다 총체적인 접근을 제안하였다"], ["that view transformation as an embodied and relational process.", "전환을 체화되고 관계적인 과정으로 보는."]]], "b3": [[["Why do some adults participate in organized learning", "왜 어떤 성인은 조직된 학습에 참여하는가"], ["while others do not?", "다른 성인은 그렇지 않은 반면?"]], [["This question has been central", "이 질문은 핵심이었다"], ["to research on adult education", "성인교육 연구에서"], ["for more than half a century.", "반세기 넘게."]], [["Cross (1981) classified the barriers", "크로스(1981)는 장애요인을 분류하였다"], ["that prevent adults from participating", "성인의 참여를 가로막는"], ["into three categories.", "세 가지 범주로."]], [["Situational barriers arise", "상황적 장애요인은 생겨난다"], ["from one's life situation at a given time,", "특정 시점의 생활 상황에서,"], ["such as a lack of time", "시간 부족과 같은"], ["due to work and family responsibilities.", "일과 가족에 대한 책임으로 인한."]], [["Institutional barriers consist of practices and procedures", "기관적 장애요인은 관행과 절차로 이루어진다"], ["that exclude or discourage adults,", "성인을 배제하거나 의욕을 꺾는,"], ["including inconvenient schedules, high fees, and strict admission requirements.", "불편한 일정, 높은 수강료, 엄격한 입학 요건을 포함하여."]], [["Dispositional barriers are related", "성향적 장애요인은 관련된다"], ["to attitudes and self-perceptions about oneself as a learner,", "학습자로서의 자신에 대한 태도와 자기인식과,"], ["such as the belief", "믿음과 같은"], ["that one is too old to learn.", "자신이 배우기에는 너무 나이가 많다는."]], [["Although Cross's typology is still widely used,", "크로스의 유형 분류는 여전히 널리 사용되지만,"], ["it focuses mainly on individuals", "그것은 주로 개인에 초점을 맞춘다"], ["and tends to overlook structural factors.", "그리고 구조적 요인을 간과하는 경향이 있다."]], [["Rubenson and Desjardins (2009) argued that", "루벤슨과 데자르댕(2009)은 ~라고 주장하였다"], ["participation must be understood", "참여는 이해되어야 한다"], ["in relation to the broader welfare state and labor market policies.", "보다 넓은 복지국가 및 노동시장 정책과의 관계 속에서."]], [["Their comparative analysis showed that", "그들의 비교 분석은 ~을 보여주었다"], ["countries with strong public support for adult education", "성인교육에 대한 공적 지원이 강한 국가들이"], ["had higher participation rates", "더 높은 참여율을 보였다"], ["and smaller gaps between social groups.", "그리고 사회집단 간 격차가 더 작았다."]], [["These findings suggest that", "이러한 결과는 ~을 시사한다"], ["reducing barriers to participation requires not only individual motivation", "참여 장애요인을 줄이는 것은 개인의 동기뿐 아니라"], ["but also policy efforts to create supportive structures.", "지원적인 구조를 만들기 위한 정책적 노력도 필요로 한다."]]], "b4": [[["The idea that learning continues throughout life", "학습이 평생에 걸쳐 계속된다는 생각은"], ["is not new,", "새로운 것이 아니다,"], ["but it became a global policy agenda", "그러나 그것은 세계적인 정책 의제가 되었다"], ["only in the second half of the twentieth century.", "20세기 후반에 이르러서야."]], [["In 1972,", "1972년에,"], ["UNESCO published Learning to Be,", "유네스코는 『존재를 위한 학습』을 발간하였다,"], ["commonly known as the Faure Report,", "흔히 포르 보고서로 알려진,"], ["which called for the development of a learning society", "그것은 학습사회의 발전을 촉구하였다"], ["in which education is not limited to schools.", "교육이 학교에 한정되지 않는."]], [["The report presented lifelong education as a master concept", "이 보고서는 평생교육을 핵심 개념으로 제시하였다"], ["for reforming entire educational systems.", "교육체제 전반을 개혁하기 위한."]], [["Its vision was strongly humanistic,", "그 비전은 강한 인본주의적 성격을 띠었다,"], ["emphasizing the complete fulfillment of the individual", "개인의 완전한 자아실현을 강조하면서"], ["and the democratization of education.", "그리고 교육의 민주화를."]], [["In 1996,", "1996년에,"], ["the Delors Report, Learning: The Treasure Within, renewed this vision", "들로르 보고서 『학습: 내재된 보물』은 이 비전을 새롭게 하였다"], ["by proposing four pillars of learning:", "학습의 네 기둥을 제안함으로써:"], ["learning to know, learning to do, learning to live together, and learning to be.", "알기 위한 학습, 행동하기 위한 학습, 함께 살기 위한 학습, 존재하기 위한 학습."]], [["Around the same time, however,", "그러나 비슷한 시기에,"], ["organizations such as the OECD began to frame lifelong learning", "OECD와 같은 기구들은 평생학습을 규정하기 시작하였다"], ["primarily in economic terms,", "주로 경제적 관점에서,"], ["linking it to human capital and national competitiveness.", "그것을 인적자본 및 국가경쟁력과 연결하면서."]], [["This shift from lifelong education to lifelong learning", "평생교육에서 평생학습으로의 이러한 전환은"], ["placed greater responsibility on individuals", "개인에게 더 큰 책임을 지웠다"], ["to keep updating their skills.", "자신의 기술을 계속 갱신해야 할."]], [["Critics have pointed out that", "비판자들은 ~라고 지적해 왔다"], ["such an approach may widen inequality,", "그러한 접근이 불평등을 확대할 수 있다,"], ["since those with more resources", "더 많은 자원을 가진 사람들이"], ["are better able to take advantage of learning opportunities.", "학습기회를 더 잘 활용할 수 있기 때문에."]], [["Today,", "오늘날,"], ["lifelong learning policies in many countries attempt to balance economic goals", "많은 국가의 평생학습 정책은 경제적 목표의 균형을 맞추려 한다"], ["with social inclusion and personal development.", "사회적 포용 및 개인의 발달과."]]], "b5": [[["Self-directed learning is one of the most extensively studied topics", "자기주도학습은 가장 광범위하게 연구된 주제 가운데 하나이다"], ["in adult education.", "성인교육에서."]], [["Interest in this topic grew", "이 주제에 대한 관심은 커졌다"], ["after Tough (1971) found that", "터프(1971)가 ~을 발견한 이후"], ["most adults undertake several learning projects each year,", "대부분의 성인이 매년 여러 개의 학습 프로젝트를 수행한다,"], ["many of which are planned and carried out by themselves.", "그중 다수는 스스로 계획하고 실행된다."]], [["Knowles (1975) described self-directed learning as a process", "놀스(1975)는 자기주도학습을 과정으로 설명하였다"], ["in which individuals take the initiative,", "개인이 주도권을 갖는,"], ["with or without the help of others,", "타인의 도움이 있든 없든,"], ["in diagnosing their learning needs, formulating goals, identifying resources, and evaluating outcomes.", "학습요구를 진단하고, 목표를 세우고, 자원을 확인하고, 성과를 평가하는 데 있어."]], [["Early studies treated self-directed learning", "초기 연구들은 자기주도학습을 다루었다"], ["as a linear sequence of steps.", "단계들의 선형적인 연속으로."]], [["Later models, however, emphasized that", "그러나 이후의 모델들은 ~을 강조하였다"], ["the process is often unplanned", "그 과정이 흔히 계획되지 않는다"], ["and shaped by opportunities", "그리고 기회에 의해 형성된다"], ["that arise in the learner's environment.", "학습자의 환경에서 생겨나는."]], [["Researchers have also distinguished", "연구자들은 또한 구분해 왔다"], ["between self-directed learning as a process", "과정으로서의 자기주도학습과"], ["and self-direction as a personal attribute.", "개인적 특성으로서의 자기주도성을."]], [["The latter is commonly measured", "후자는 흔히 측정된다"], ["with instruments such as the Self-Directed Learning Readiness Scale,", "자기주도학습 준비도 척도와 같은 도구로,"], ["and it has been found to correlate", "그리고 그것은 상관이 있는 것으로 밝혀졌다"], ["with life satisfaction, academic achievement, and career adaptability.", "삶의 만족도, 학업성취, 경력적응력과."]], [["In the digital age,", "디지털 시대에,"], ["self-directed learning has gained new importance,", "자기주도학습은 새로운 중요성을 얻게 되었다,"], ["as adults increasingly learn", "성인이 점점 더 배우게 되면서"], ["through online resources and communities.", "온라인 자원과 공동체를 통해."]], [["At the same time,", "동시에,"], ["scholars caution that", "학자들은 ~라고 경고한다"], ["not all adults are equally prepared to direct their own learning,", "모든 성인이 자신의 학습을 주도할 준비가 똑같이 되어 있는 것은 아니다,"], ["and that educators must provide support", "그리고 교육자는 지원을 제공해야 한다"], ["that gradually builds learners' capacity for autonomy.", "학습자의 자율 역량을 점진적으로 길러 주는."]]], "b6": [[["Traditional views of learning have focused on the acquisition of knowledge", "학습에 대한 전통적인 관점은 지식의 습득에 초점을 맞추어 왔다"], ["that exists in the mind of the individual.", "개인의 마음속에 존재하는."]], [["In contrast,", "이와 대조적으로,"], ["Lave and Wenger (1991) argued that", "레이브와 웽거(1991)는 ~라고 주장하였다"], ["learning is fundamentally situated in social practice.", "학습은 근본적으로 사회적 실천 속에 위치한다."]], [["Drawing on studies of apprenticeship among tailors, midwives, and butchers,", "재단사, 산파, 정육점 종사자의 도제 학습 연구를 바탕으로,"], ["they introduced the concept of legitimate peripheral participation", "그들은 정당한 주변적 참여라는 개념을 도입하였다"], ["to describe how newcomers become full members", "신참자가 어떻게 완전한 구성원이 되는지를 설명하기 위해"], ["of a community of practice.", "실천공동체의."]], [["Newcomers initially take part", "신참자는 처음에 참여한다"], ["in simple and low-risk tasks", "단순하고 위험이 낮은 과업에"], ["at the edge of the community.", "공동체의 가장자리에서."]], [["As they gain experience,", "경험을 쌓으면서,"], ["they move toward the center,", "그들은 중심으로 이동한다,"], ["taking on more complex responsibilities", "더 복잡한 책임을 맡으며"], ["and developing a new identity as a practitioner.", "그리고 실천가로서의 새로운 정체성을 형성하며."]], [["From this perspective,", "이 관점에서,"], ["learning is not merely a change in what one knows", "학습은 단지 무엇을 아는지의 변화가 아니다"], ["but a transformation of who one is.", "자신이 누구인지의 변화이다."]], [["Wenger (1998) later elaborated that", "웽거(1998)는 이후 ~라고 정교화하였다"], ["communities of practice are characterized", "실천공동체는 특징지어진다"], ["by mutual engagement, a joint enterprise, and a shared repertoire", "상호 참여, 공동의 과업, 그리고 공유된 레퍼토리로"], ["of tools, stories, and ways of doing things.", "도구, 이야기, 일하는 방식의."]], [["The concept has been widely adopted", "이 개념은 폭넓게 채택되어 왔다"], ["in research on workplace learning and professional development,", "일터학습과 전문성 개발 연구에서,"], ["including studies of teachers, nurses, and lifelong educators.", "교사, 간호사, 평생교육사에 관한 연구를 포함하여."]], [["Critics, however, note that", "그러나 비판자들은 ~라고 지적한다"], ["the theory pays limited attention", "이 이론이 제한적인 관심만 기울인다"], ["to conflict and power relations within communities,", "공동체 내부의 갈등과 권력관계에,"], ["which may prevent some newcomers", "그것은 일부 신참자를 가로막을 수 있다"], ["from gaining full access.", "완전한 접근을 얻는 것으로부터."]]], "b7": [[["Paulo Freire's Pedagogy of the Oppressed (1970)", "파울루 프레이리의 『억압받는 자들의 교육학』(1970)은"], ["has had a profound influence", "깊은 영향을 미쳐 왔다"], ["on adult education around the world.", "전 세계 성인교육에."]], [["Freire criticized what he called banking education,", "프레이리는 그가 은행저금식 교육이라 부른 것을 비판하였다,"], ["in which teachers deposit information into passive students,", "그 교육에서 교사는 수동적인 학생에게 정보를 예금하듯 넣는다,"], ["who are expected to receive, memorize, and repeat it.", "학생은 그것을 받아들이고, 암기하고, 반복하도록 기대된다."]], [["Such education,", "그러한 교육은,"], ["he argued,", "그는 주장하기를,"], ["serves to maintain existing power relations", "기존의 권력관계를 유지하는 데 기여한다"], ["by discouraging learners from questioning their reality.", "학습자가 자신의 현실에 의문을 제기하지 못하게 함으로써."]], [["As an alternative,", "그 대안으로,"], ["Freire proposed problem-posing education,", "프레이리는 문제제기식 교육을 제안하였다,"], ["in which teachers and learners engage in dialogue as equals", "그 교육에서 교사와 학습자는 대등한 존재로서 대화한다"], ["and investigate the problems of their everyday lives together.", "그리고 일상생활의 문제를 함께 탐구한다."]], [["In his literacy programs in Brazil,", "브라질에서의 그의 문해 프로그램에서,"], ["learners began by discussing generative words,", "학습자들은 생성어를 토론하는 것으로 시작하였다,"], ["such as \"slum\" and \"work,\"", "'빈민가'나 '노동' 같은,"], ["that carried deep meaning in their own lives.", "자신의 삶에서 깊은 의미를 지닌."]], [["Through this process,", "이 과정을 통해,"], ["they learned to read not only the word", "그들은 글자뿐 아니라"], ["but also the world.", "세계를 읽는 법도 배웠다."]], [["Freire called this awakening of critical consciousness conscientization,", "프레이리는 이러한 비판적 의식의 각성을 의식화라고 불렀다,"], ["and he saw it as inseparable", "그리고 그는 그것을 분리될 수 없는 것으로 보았다"], ["from action to transform social conditions.", "사회적 조건을 변화시키기 위한 행동과."]], [["His ideas have inspired", "그의 사상은 영감을 주어 왔다"], ["popular education movements, participatory action research, and critical approaches to literacy", "민중교육 운동, 참여적 실행연구, 문해에 대한 비판적 접근에"], ["in many countries, including Korea.", "한국을 포함한 많은 나라에서."]], [["At the same time,", "동시에,"], ["some scholars have questioned", "일부 학자들은 의문을 제기해 왔다"], ["whether his framework,", "그의 틀이,"], ["developed in the context of Latin American poverty,", "라틴아메리카의 빈곤이라는 맥락에서 발전된,"], ["can be applied directly to other societies", "다른 사회에 그대로 적용될 수 있는지"], ["without careful adaptation.", "신중한 조정 없이."]]], "b8": [[["Experience has long been regarded", "경험은 오랫동안 여겨져 왔다"], ["as a central resource for adult learning.", "성인학습의 핵심 자원으로."]], [["Building on the work of Dewey, Lewin, and Piaget,", "듀이, 레빈, 피아제의 연구를 토대로,"], ["Kolb (1984) proposed a model", "콜브(1984)는 모형을 제안하였다"], ["in which learning is defined as the process", "학습이 과정으로 정의되는"], ["whereby knowledge is created through the transformation of experience.", "경험의 변환을 통해 지식이 창출되는."]], [   return out;
}

function jdBind(p, el){
  $$("[data-mode]", el).forEach(b => b.onclick = () => { jdMode = b.dataset.mode; lsSet(LSP+"mode", jdMode); jdOpen = new Set(); a4Line = -1; keepScroll(renderPractice); });
  if (jdMode === "a4") return a4Bind(p, el);
  if (jdMode !== "jd") return;
  const {data} = jdChunks(p);
  const total = data.reduce((a, s) => a + s.length, 0);
  const show = (k, scroll) => {
    jdOpen.add(k);
    const [i, j] = k.split("-").map(Number);
    const row = $(`.jdrow[data-k="${k}"]`, el);
    if (row) { row.classList.add("open"); $(".jdk", row).textContent = data[i][j][1] || "직접 떠올려 보세요"; if (scroll) row.scrollIntoView({block:"center", behavior:"smooth"}); }
    $$(".chunk.cur", el).forEach(c => c.classList.remove("cur"));
    const ck = $(`.chunk[data-ck="${k}"]`, el); if (ck) ck.classList.add("cur");
    $("#jdCount").textContent = `${jdOpen.size} / ${total}`;
    if (jdOpen.size === total) $("#jdNext").textContent = "끝까지 했어요";
  };
  $$(".jdrow", el).forEach(r => r.onclick = () => show(r.dataset.k, false));
  $("#jdNext").onclick = () => {
    for (let i = 0; i < data.length; i++) for (let j = 0; j < data[i].length; j++) { const k = `${i}-${j}`; if (!jdOpen.has(k)) return show(k, true); }
  };
  $("#jdAll").onclick = () => { data.forEach((s, i) => s.forEach((_, j) => jdOpen.add(`${i}-${j}`))); keepScroll(renderPractice); };
  $("#jdReset").onclick = () => { jdOpen = new Set(); keepScroll(renderPractice); };
  if (jdOpen.size === total && $("#jdNext")) $("#jdNext").textContent = "끝까지 했어요";
  const ai = $("#jdAI");
  if (ai) getSample().then(sample => {
    if (!sample) return; ai.hidden = false;
    ai.onclick = async () => {
      const out = $("#jdAIOut"); jdCtl?.abort(); jdCtl = new AbortController();
      ai.disabled = true; out.innerHTML = `<span class="thinking">끊어 읽기를 만들고 있어요.</span>`;
      const prompt = `아래 영어 문장들을 한국어 '직독직역'으로 연습할 수 있게 의미 덩어리로 끊어라. 덩어리는 원문 순서 그대로, 원문 단어를 하나도 바꾸거나 빼지 말고, 콤마와 연결어(which, that, whereas), 전치사구, to부정사 앞에서 끊는다. 각 덩어리에 앞에서부터 바로 옮긴 한국어(직독직역, 학술 문체)를 붙인다.
JSON만 답하라: 문장마다 하나의 배열, 그 안에 [영어 덩어리, 한국어] 쌍. 예: [[["This study aims to explore","본 연구는 탐색하고자 한다"],["how adults learn.","성인이 어떻게 배우는지를."]]]

${p.s.map((x, i) => `${i+1}. ${x[0]}`).join("\n")}`;
      try {
        const r = await sample.json(prompt, {signal:jdCtl.signal});
        if (!Array.isArray(r) || !r.length) throw {code:"invalid_json"};
        p.chunks = r.map(sent => (Array.isArray(sent) ? sent : []).filter(c => Array.isArray(c) && c[0]).map(c => [String(c[0]), String(c[1] || "")]));
        save(); jdOpen = new Set(); keepScroll(renderPractice);
      } catch (e) { out.innerHTML = `<span class="err">${esc(errCopy(e))}</span>`; ai.disabled = false; }
    };
  });
}
// ---------- log ----------
let confirmReset = false;
function renderLog(){
  const el = $("#tab-log");
  const keys = []; const d = new Date(); d.setDate(d.getDate() - 13);
  for (let i = 0; i < 14; i++) { keys.push(dkey(d)); d.setDate(d.getDate() + 1); }
  const vals = keys.map(k => { const x = S.days[k] || {}; return (x.t || 0) + (x.p || 0) * 10; });
  const max = Math.max(10, ...vals);
  const pmap = Object.fromEntries(allPassages().map(p => [p.id, p]));
  const atts = S.attempts.slice().reverse().slice(0, 30);
  el.innerHTML = `
  <div class="stack">
    <div class="panel stack" style="gap:10px">
      <div class="row between"><h3>최근 2주 학습량</h3><span class="small muted">용어 1장 = 1, 지문 1편 = 10</span></div>
      <div class="days" role="img" aria-label="최근 14일 학습량 막대">${vals.map((v,i) => `<div class="${v ? "" : "zero"}" style="height:${v ? Math.max(6, v / max * 100) : 2}%" title="${fmtDate(keys[i])}: 용어 ${(S.days[keys[i]]||{}).t||0} · 지문 ${(S.days[keys[i]]||{}).p||0}"></div>`).join("")}</div>
      <div class="daylab">${keys.map(k => `<span>${fmtDate(k).split("/")[1]}</span>`).join("")}</div>
    </div>

    <div class="panel stack" style="gap:10px">
      <h3>분류별 용어</h3>
      ${CATS.map(c => { const ts = T.filter(t => t.cat === c), k = ts.filter(t => S.terms[t.en] === "known").length, a = ts.filter(t => S.terms[t.en] === "again").length;
        return `<div class="stack" style="gap:4px"><div class="row between small"><span>${esc(c)}</span><span class="num muted">알아요 ${k} · 다시 ${a} · 전체 ${ts.length}</span></div><div class="bar"><i style="width:${Math.round(k/ts.length*100)}%"></i></div></div>`; }).join("")}
    </div>

    <div class="panel stack" style="gap:10px">
      <h3>해석 기록</h3>
      ${atts.length ? `<div class="tablewrap"><table><thead><tr><th>날짜</th><th>지문</th><th>자가평가</th><th>첨삭</th><th>시간</th></tr></thead><tbody>
      ${atts.map(a => `<tr><td class="num">${fmtDate(a.date)}</td><td>${esc(pmap[a.pid]?.title || "삭제한 지문")}</td><td>${["","많이 막힘","조금 막힘","막힘 없이"][a.self] || "-"}</td><td class="num">${a.score != null ? a.score + "/10" : "-"}</td><td class="num">${a.secs ? mmss(a.secs) : "-"}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="muted">아직 기록이 없어요. '초록 해석' 탭에서 첫 지문을 해석하고 자가평가를 남기면 여기에 쌓여요.</p>`}
    </div>

    <div class="row" id="resetWrap">
      ${confirmReset ? `<div class="confirm"><span class="small">용어, 해석 기록, 계획 체크, 만든 지문이 모두 지워져요.</span><button class="btn small" id="resetYes">모두 지우기</button><button class="btn ghost small" id="resetNo">취소</button></div>`
        : `<button class="btn ghost small" id="resetBtn">기록 초기화</button>`}
    </div>
  </div>`;
  if (confirmReset) {
    $("#resetNo").onclick = () => { confirmReset = false; renderLog(); };
    $("#resetYes").onclick = () => { confirmReset = false; S = blank(); deck = []; save(); renderBadge(); renderLog(); };
  } else $("#resetBtn").onclick = () => { confirmReset = true; renderLog(); };
}

// ---------- boot ----------
showTab(tab);
initStore();
